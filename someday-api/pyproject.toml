# someday-api — FastAPI application (not a library, no build/install needed)
# To install deps: pip install -r requirements.txt
# To run:         python run.py  (or uvicorn main:app --reload)

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
