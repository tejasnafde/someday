name: App Store live watch

# Hourly until Someday.s public App Store page exists, then one Discord post and the
# workflow disables itself. The page returns 404 until Apple approves and
# publishes the app. A known app is checked as a control, so a Play outage or a
# block on GitHub runners cannot look like "not live yet" forever unnoticed.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  actions: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Check the App Store page
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
        run: |
          URL="https://apps.apple.com/us/app/id6819052816"
          code=$(curl -sL -o /dev/null -w "%{http_code}" "$URL")
          control=$(curl -sL -o /dev/null -w "%{http_code}" "https://apps.apple.com/us/app/id310633997")
          echo "someday=$code control=$control"
          if [ "$control" != "200" ]; then echo "::warning::control check failed ($control); result not trusted"; exit 0; fi
          if [ "$code" = "200" ]; then
            curl -s -X POST "$DISCORD_WEBHOOK_URL" -H "Content-Type: application/json" \
              -d "{\"username\":\"App Store\",\"content\":\"Someday is LIVE on the App Store: $URL\"}"
            gh workflow disable "App Store live watch" -R "$GITHUB_REPOSITORY"
          fi
