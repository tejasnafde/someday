name: App

on:
  push:
    branches: [main]
    paths: [someday-app/**]
  pull_request:
    paths: [someday-app/**]

jobs:
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: someday-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: someday-app/package-lock.json

      - run: npm ci
      - run: npx tsc --noEmit

  notify-failure:
    name: Discord alert
    needs: [typecheck]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Post to Discord
        run: |
          curl -s -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"username\":\"GitHub CI\",\"content\":\"🔴 **App CI failed** on \`${{ github.ref_name }}\` - ${{ github.event.head_commit.message || github.event.pull_request.title }}\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}>\"}"
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

  build:
    name: EAS Build (Android)
    needs: typecheck
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: someday-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: someday-app/package-lock.json

      - run: npm ci

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish EAS build
        run: eas build --platform android --profile production --non-interactive
