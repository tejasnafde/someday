name: API

on:
  push:
    branches: [main]
    paths: [someday-api/**]
  pull_request:
    paths: [someday-api/**]

jobs:
  test:
    name: Pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: someday-api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: someday-api/requirements.txt

      - run: pip install -r requirements.txt pytest pytest-asyncio anyio httpx

      - run: pytest tests/ -v --tb=short
        env:
          APP_ENV: test
          SUPABASE_URL: https://test.supabase.co
          SUPABASE_ANON_KEY: test-anon-key
          DATABASE_URL: postgresql://test:test@localhost/test
          LOG_LEVEL: WARNING

  notify-failure:
    name: Discord alert
    needs: [test, deploy]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Post to Discord
        run: |
          curl -s -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"username\":\"GitHub CI\",\"content\":\"🔴 **API CI failed** on \`${{ github.ref_name }}\` — ${{ github.event.head_commit.message || github.event.pull_request.title }}\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}>\"}"
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

  deploy:
    name: Deploy to Cloud Run
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # for Workload Identity Federation
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build & push image
        run: |
          IMAGE="asia-south1-docker.pkg.dev/teejayproject/cloud-run-source-deploy/someday-api:${{ github.sha }}"
          gcloud builds submit someday-api --tag "$IMAGE" --project teejayproject --quiet

      - name: Deploy
        run: |
          IMAGE="asia-south1-docker.pkg.dev/teejayproject/cloud-run-source-deploy/someday-api:${{ github.sha }}"
          gcloud run deploy someday-api \
            --image "$IMAGE" \
            --region asia-south1 \
            --project teejayproject \
            --update-env-vars "^|^APP_ENV=production|LOG_LEVEL=INFO|SUPABASE_URL=https://hltpqcmmpddjhijqeeko.supabase.co|ALLOWED_ORIGINS=http://localhost:3000,https://someday-web-gamma.vercel.app" \
            --update-secrets "DATABASE_URL=DATABASE_URL:latest,SUPABASE_ANON_KEY=SUPABASE_ANON_KEY:latest,SUPABASE_SERVICE_ROLE_KEY=SUPABASE_SERVICE_ROLE_KEY:latest,EAS_WEBHOOK_SECRET=EAS_WEBHOOK_SECRET:latest,GITHUB_TOKEN=GITHUB_TOKEN:latest,DISCORD_WEBHOOK_URL=DISCORD_WEBHOOK_URL:latest" \
            --quiet
