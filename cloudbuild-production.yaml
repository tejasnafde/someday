# Production deploy: builds someday-api and rolls it out to Cloud Run.
# Triggered on push to main when someday-api/** changes.
# Secrets are in GCP Secret Manager - add new ones with:
#   gcloud secrets create MY_SECRET --project=teejayproject --data-file=-
#   gcloud secrets add-iam-policy-binding MY_SECRET --member=serviceAccount:974343814740-compute@developer.gserviceaccount.com --role=roles/secretmanager.secretAccessor
#   then add MY_SECRET=MY_SECRET:latest to --update-secrets below.

steps:
  - id: test
    name: python:3.12-slim
    entrypoint: bash
    args:
      - "-c"
      - "pip install -r requirements-dev.txt -q && pytest tests/ -q"
    dir: someday-api

  - id: build
    name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "${_IMAGE}", "someday-api"]
    waitFor: ["test"]

  - id: push
    name: gcr.io/cloud-builders/docker
    args: ["push", "${_IMAGE}"]

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - someday-api
      - --image=${_IMAGE}
      - --region=asia-south1
      - --update-env-vars=^|^APP_ENV=production|LOG_LEVEL=INFO|SUPABASE_URL=https://hltpqcmmpddjhijqeeko.supabase.co|ALLOWED_ORIGINS=https://someday.tn07.dev,https://someday-web-gamma.vercel.app
      - --update-secrets=DATABASE_URL=DATABASE_URL:latest,SUPABASE_ANON_KEY=SUPABASE_ANON_KEY:latest,SUPABASE_SERVICE_ROLE_KEY=SUPABASE_SERVICE_ROLE_KEY:latest,EAS_WEBHOOK_SECRET=EAS_WEBHOOK_SECRET:latest,GITHUB_TOKEN=GITHUB_TOKEN:latest,DISCORD_WEBHOOK_URL=DISCORD_WEBHOOK_URL:latest,VAPID_PUBLIC_KEY=VAPID_PUBLIC_KEY:latest,VAPID_PRIVATE_KEY=VAPID_PRIVATE_KEY:latest,CLOUDBUILD_ALERT_TOKEN=CLOUDBUILD_ALERT_TOKEN:latest
      - --quiet

substitutions:
  _IMAGE: asia-south1-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/someday-api:${COMMIT_SHA}

images:
  - ${_IMAGE}

options:
  logging: CLOUD_LOGGING_ONLY
