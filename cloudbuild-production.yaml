# Production deploy: builds someday-api and rolls it out to Cloud Run.
# Triggered on push to main when someday-api/** changes.
#
# Every credential lives in ONE secret, someday-api-config, a JSON object.
# Secret Manager bills per secret version per month rather than per byte, so
# eight secrets cost eight times what one object holding the same eight values
# costs. config/settings.py expands SOMEDAY_CONFIG into os.environ at import
# time, before Settings() validates.
#
# To add a credential, edit the JSON rather than this file:
#   gcloud --configuration=personal secrets versions access latest \
#     --secret=someday-api-config > /tmp/c.json
#   # edit /tmp/c.json, then:
#   gcloud --configuration=personal secrets versions add someday-api-config \
#     --data-file=/tmp/c.json && rm /tmp/c.json
# The service reads :latest, so no redeploy is needed for a value change.
#
# VAPID_PUBLIC_KEY was dropped on 2026-08-03. A VAPID public key is public by
# design: the browser needs it, and someday-web supplies it from Vercel's
# NEXT_PUBLIC_VAPID_PUBLIC_KEY. The API only ever used the PRIVATE key
# (common_helper/notify.py). The field was declared in settings.py and read
# nowhere, so it was paid-for dead config.

steps:
  - id: test
    name: python:3.12-slim
    entrypoint: bash
    args:
      - "-c"
      - "pip install -r requirements-dev.txt -q && pytest tests/ -q"
    dir: someday-api

  - id: build
    name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "${_IMAGE}", "someday-api"]
    waitFor: ["test"]

  - id: push
    name: gcr.io/cloud-builders/docker
    args: ["push", "${_IMAGE}"]

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - someday-api
      - --image=${_IMAGE}
      - --region=asia-south1
      - --update-env-vars=^|^APP_ENV=production|LOG_LEVEL=INFO|SUPABASE_URL=https://hltpqcmmpddjhijqeeko.supabase.co|ALLOWED_ORIGINS=https://someday.tn07.dev,https://someday-web-gamma.vercel.app
      # --set-secrets, not --update-secrets: update MERGES, so the eight old
      # per-value refs would stay attached and this line would stop describing
      # reality. set REPLACES, which is what detaches them.
      - --set-secrets=SOMEDAY_CONFIG=someday-api-config:latest
      - --quiet

substitutions:
  _IMAGE: asia-south1-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/someday-api:${COMMIT_SHA}

images:
  - ${_IMAGE}

options:
  logging: CLOUD_LOGGING_ONLY
